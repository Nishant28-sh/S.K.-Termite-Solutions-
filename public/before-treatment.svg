<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="skyB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3428"/>
      <stop offset="100%" stop-color="#2a2620"/>
    </linearGradient>
    <linearGradient id="groundB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c4a34"/>
      <stop offset="55%" stop-color="#4a3b29"/>
      <stop offset="100%" stop-color="#332920"/>
    </linearGradient>
    <linearGradient id="wallB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a7458"/>
      <stop offset="100%" stop-color="#6b5842"/>
    </linearGradient>
    <linearGradient id="woodB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7a5a34"/>
      <stop offset="100%" stop-color="#5c4326"/>
    </linearGradient>
    <radialGradient id="vignB" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#skyB)"/>

  <!-- distant house silhouette in disrepair -->
  <g opacity="0.55">
    <rect x="120" y="230" width="380" height="200" fill="url(#wallB)"/>
    <polygon points="110,232 310,140 510,232" fill="#4a3b29"/>
    <rect x="220" y="300" width="60" height="90" fill="#2a2620"/>
    <rect x="330" y="290" width="55" height="55" fill="#2a2620" opacity="0.8"/>
  </g>

  <!-- crack lines through the wall -->
  <g stroke="#1c1712" stroke-width="3" fill="none" opacity="0.85" stroke-linecap="round">
    <path d="M260 300 L246 340 L268 372 L250 410"/>
    <path d="M360 292 L378 330 L358 360 L372 396"/>
  </g>

  <!-- exposed foundation trench (ground cross-section) -->
  <rect x="0" y="430" width="1200" height="245" fill="url(#groundB)"/>
  <path d="M0 430 L1200 430 L1200 460 Q 600 500 0 460 Z" fill="#3a2f22" opacity="0.6"/>

  <!-- damaged wooden beam exposed in trench -->
  <g>
    <rect x="430" y="470" width="480" height="70" rx="6" fill="url(#woodB)"/>
    <rect x="430" y="470" width="480" height="70" rx="6" fill="none" stroke="#3a2b18" stroke-width="2"/>
    <!-- termite damage holes -->
    <g fill="#241a0f">
      <ellipse cx="490" cy="495" rx="9" ry="6"/>
      <ellipse cx="540" cy="512" rx="7" ry="5"/>
      <ellipse cx="610" cy="490" rx="10" ry="7"/>
      <ellipse cx="670" cy="520" rx="8" ry="6"/>
      <ellipse cx="740" cy="498" rx="9" ry="6"/>
      <ellipse cx="800" cy="516" rx="7" ry="5"/>
      <ellipse cx="855" cy="486" rx="9" ry="6"/>
    </g>
    <!-- wood grain crumble texture -->
    <g stroke="#3a2b18" stroke-width="1.5" opacity="0.5">
      <path d="M440 480 h460"/>
      <path d="M440 500 h460"/>
      <path d="M440 520 h460"/>
    </g>
  </g>

  <!-- termite mud tubes climbing the wall -->
  <g fill="none" stroke="#8a5a2e" stroke-width="14" stroke-linecap="round" opacity="0.92">
    <path d="M300 430 C 296 380, 320 340, 300 300 C 284 268, 306 240, 292 210"/>
    <path d="M330 430 C 336 390, 312 360, 334 320" stroke-width="9"/>
  </g>
  <g fill="none" stroke="#a06a36" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <path d="M300 430 C 296 380, 320 340, 300 300 C 284 268, 306 240, 292 210"/>
  </g>

  <!-- swarm of termites (simple dots with wings) scattered -->
  <g fill="#d8b06a" opacity="0.9">
    <circle cx="640" cy="330" r="3.5"/>
    <circle cx="672" cy="300" r="3"/>
    <circle cx="700" cy="345" r="3.5"/>
    <circle cx="580" cy="360" r="3"/>
    <circle cx="620" cy="280" r="2.5"/>
    <circle cx="760" cy="320" r="3"/>
  </g>

  <!-- warning tag -->
  <g transform="translate(60,60)">
    <rect x="0" y="0" width="230" height="56" rx="28" fill="#111827" fill-opacity="0.75"/>
    <circle cx="30" cy="28" r="10" fill="#c1502e"/>
    <text x="52" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#F8F5EF">Untreated Site</text>
  </g>

  <rect width="1200" height="675" fill="url(#vignB)"/>
</svg>
