<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="skyA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f3320"/>
      <stop offset="100%" stop-color="#0b2418"/>
    </linearGradient>
    <linearGradient id="groundA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9bda2"/>
      <stop offset="55%" stop-color="#b3a687"/>
      <stop offset="100%" stop-color="#8f8267"/>
    </linearGradient>
    <linearGradient id="wallA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F5EF"/>
      <stop offset="100%" stop-color="#E4DFD2"/>
    </linearGradient>
    <linearGradient id="pipeA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DDAE55"/>
      <stop offset="100%" stop-color="#C58F2C"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C58F2C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C58F2C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignA" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#skyA)"/>
  <rect width="1200" height="675" fill="url(#glowA)"/>

  <!-- clean house facade -->
  <g>
    <rect x="120" y="210" width="420" height="220" fill="url(#wallA)"/>
    <polygon points="105,212 330,110 555,212" fill="#14532D"/>
    <rect x="230" y="290" width="70" height="100" rx="4" fill="#0B3A1F"/>
    <rect x="360" y="270" width="60" height="60" rx="4" fill="#DDAE55" fill-opacity="0.55"/>
    <rect x="360" y="270" width="60" height="60" rx="4" fill="none" stroke="#0B3A1F" stroke-width="3"/>
    <line x1="390" y1="270" x2="390" y2="330" stroke="#0B3A1F" stroke-width="3"/>
    <line x1="360" y1="300" x2="420" y2="300" stroke="#0B3A1F" stroke-width="3"/>
  </g>

  <!-- neat sealed foundation trench with soil -->
  <rect x="0" y="430" width="1200" height="245" fill="url(#groundA)"/>
  <path d="M0 430 L1200 430 L1200 452 Q 600 470 0 452 Z" fill="#a7987a"/>

  <!-- porous pipe network laid neatly along the trench -->
  <g>
    <rect x="60" y="470" width="1080" height="16" rx="8" fill="url(#pipeA)"/>
    <rect x="60" y="500" width="1080" height="16" rx="8" fill="url(#pipeA)" opacity="0.85"/>
    <!-- perforation dots on the pipe -->
    <g fill="#7a5518">
      <circle cx="120" cy="478" r="2.2"/>
      <circle cx="160" cy="478" r="2.2"/>
      <circle cx="200" cy="478" r="2.2"/>
      <circle cx="240" cy="478" r="2.2"/>
      <circle cx="280" cy="478" r="2.2"/>
      <circle cx="320" cy="478" r="2.2"/>
      <circle cx="360" cy="478" r="2.2"/>
      <circle cx="400" cy="478" r="2.2"/>
      <circle cx="440" cy="478" r="2.2"/>
      <circle cx="480" cy="478" r="2.2"/>
      <circle cx="520" cy="478" r="2.2"/>
      <circle cx="560" cy="478" r="2.2"/>
      <circle cx="600" cy="478" r="2.2"/>
      <circle cx="640" cy="478" r="2.2"/>
      <circle cx="680" cy="478" r="2.2"/>
      <circle cx="720" cy="478" r="2.2"/>
      <circle cx="760" cy="478" r="2.2"/>
      <circle cx="800" cy="478" r="2.2"/>
      <circle cx="840" cy="478" r="2.2"/>
      <circle cx="880" cy="478" r="2.2"/>
      <circle cx="920" cy="478" r="2.2"/>
      <circle cx="960" cy="478" r="2.2"/>
      <circle cx="1000" cy="478" r="2.2"/>
      <circle cx="1040" cy="478" r="2.2"/>
      <circle cx="1080" cy="478" r="2.2"/>
    </g>
  </g>

  <!-- fresh sealed concrete cap over the trench -->
  <rect x="60" y="530" width="1080" height="46" rx="8" fill="#d8cfb8" stroke="#a7987a" stroke-width="2"/>
  <g stroke="#a7987a" stroke-width="1.5" opacity="0.7">
    <line x1="120" y1="530" x2="120" y2="576"/>
    <line x1="240" y1="530" x2="240" y2="576"/>
    <line x1="360" y1="530" x2="360" y2="576"/>
    <line x1="480" y1="530" x2="480" y2="576"/>
    <line x1="600" y1="530" x2="600" y2="576"/>
    <line x1="720" y1="530" x2="720" y2="576"/>
    <line x1="840" y1="530" x2="840" y2="576"/>
    <line x1="960" y1="530" x2="960" y2="576"/>
    <line x1="1080" y1="530" x2="1080" y2="576"/>
  </g>

  <!-- small greenery around the treated home -->
  <g fill="#1D6B3B">
    <ellipse cx="90" cy="600" rx="34" ry="20"/>
    <ellipse cx="1120" cy="600" rx="40" ry="22"/>
    <ellipse cx="1000" cy="440" rx="26" ry="16"/>
  </g>

  <!-- shield / protected badge -->
  <g transform="translate(870,150)">
    <path d="M60 0 L118 22 V70 C118 108 92 132 60 148 C28 132 2 108 2 70 V22 Z" fill="#C58F2C"/>
    <path d="M60 0 L118 22 V70 C118 108 92 132 60 148 C28 132 2 108 2 70 V22 Z" fill="none" stroke="#111827" stroke-width="3" stroke-opacity="0.15"/>
    <path d="M34 74 L52 92 L88 50" fill="none" stroke="#111827" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- label tag -->
  <g transform="translate(60,60)">
    <rect x="0" y="0" width="248" height="56" rx="28" fill="#F8F5EF" fill-opacity="0.92"/>
    <circle cx="30" cy="28" r="10" fill="#14532D"/>
    <text x="52" y="34" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Fully Protected</text>
  </g>

  <rect width="1200" height="675" fill="url(#vignA)"/>
</svg>
